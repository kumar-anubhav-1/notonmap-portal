<!doctype html>
<html lang="en" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFDE21">
<meta name="google-notranslate" content="true">
<title>Rural Tourism Mentor</title>
<meta name="description" content="Practical help for village hosts: safe hospitality, new local experiences and printable guides.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5C57'/%3E%3Ccircle cx='32' cy='28' r='10' fill='%23FFDE21'/%3E%3Cpath d='M32 54 20 34h24z' fill='%23FFDE21'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="backBtn" class="icon-btn" hidden aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="avatar logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
    <div class="brand"><span class="brand-name" id="brandName">Rural Tourism Mentor</span><span class="brand-sub" id="brandSub"></span></div>
    <button id="menuBtn" class="avatar user" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
    </button>
    <div id="menu" class="menu" role="menu" hidden>
      <div class="langrow" role="group" aria-label="Language">
        <button id="langEn" class="lang-btn" data-lang="en">English</button>
        <button id="langHi" class="lang-btn" data-lang="hi" lang="hi">हिन्दी</button>
      </div>
      <button id="newChatBtn" class="item" hidden></button>
      <div class="sep"></div>
      <button id="forgetBtn" class="item" hidden></button>
      <div id="forgetConfirm" hidden>
        <div class="note" id="forgetAsk"></div>
        <button id="forgetYes" class="item danger"></button>
        <button id="forgetNo" class="item"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="codeView" class="view codewrap" hidden>
      <h1 id="codeTitle"></h1>
      <p id="codeHelp" class="lead"></p>
      <form id="codeForm" class="code-form">
        <input id="codeInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn primary" type="submit" id="codeBtn"></button>
      </form>
      <p id="codeError" class="error" role="alert" hidden></p>
    </section>

    <section id="homeView" class="view" hidden>
      <p id="homeLead" class="listlead"></p>
      <div id="tiles" class="tiles"></div>
      <button id="notSure" class="link-btn"></button>
    </section>

    <section id="chatView" class="view chat" hidden>
      <div class="journey-pill" id="journeyPill"></div>
      <div id="starters" class="chips starters"></div>
      <div id="thread" class="thread" aria-live="polite"></div>
    </section>
  </main>

  <form id="composer" class="composer" hidden>
    <div class="pill"><textarea id="input" rows="1" maxlength="1500"></textarea></div>
    <button type="button" id="actBtn" class="act" aria-label="Speak"></button>
  </form>
  <footer class="foot" id="foot">An initiative supported by NOM</footer>
</div>

<!-- Print-only guide, filled when the person taps Download PDF or Print -->
<div id="printRoot" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
